<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Annotation Hub</title>
    
    <!-- Annotorious v3 Core Styles & Script via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@annotorious/annotorious@latest/dist/annotorious.css">
    <script src="https://cdn.jsdelivr.net/npm/@annotorious/annotorious@latest/dist/annotorious.js"></script>
    
</head>
<body>

    <div class="app-container">
        <!-- Control Header Area -->
        <header class="controls-panel">
            <h2>Annotorious Workspace</h2>
                <div class="actions">
                    <button id="uploadBtn" class="btn btn-primary">📁 Choose Image</button>
                    <button id="exportBtn" class="btn btn-secondary">📋 Export Annotations</button>
                    <input type="file" id="imageLoader" accept="image/*" style="display: none;">
                </div>
                <div class="shortcuts-guide">
                <strong>Shortcuts:</strong> 
                <kbd>N</kbd> New Box | <kbd>Del / Backspace</kbd> Delete | <kbd>Esc</kbd> Clear Selection
            </div>
        </header>

        <!-- Main Workspace Grid -->
        <main class="workspace">
            <!-- Image Frame Container -->
            <div class="image-wrapper" id="imageFrame">
                <div class="placeholder-text" id="placeholder">Please select an image to start annotating.</div>
                <img id="annotationTarget" alt="Annotation Area" style="display: none;">
            </div>

            <!-- Annotation Manager Sidebar -->
            <aside class="sidebar">
                <h3>Annotations</h3>
                <div id="annotationList" class="annotation-list">
                    <p class="empty-state">No boxes defined yet.</p>
                </div>
            </aside>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const imageLoader = document.getElementById('imageLoader');
            const uploadBtn = document.getElementById('uploadBtn');
            const targetImage = document.getElementById('annotationTarget');
            const placeholder = document.getElementById('placeholder');
            const annotationList = document.getElementById('annotationList');

            let annoInstance = null;
            let currentSelectedId = null;

            // Trigger file dialog
            uploadBtn.addEventListener('click', () => imageLoader.click());

        // Handle Export Button Click
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (!annoInstance) {
                alert('No annotations to export.');
                return;
            }
            const annotations = annoInstance.getAnnotations();
            if (annotations.length === 0) {
                alert('No annotations to export.');
                return;
            }
            const formattedAnnotations = annotations.map(anno => {
                const target = anno.target.selector.geometry;
                const bounds = target.bounds; // shape contains x, y, width, height
                const x0 = bounds.minX;
                const y0 = bounds.minY;
                const x1 = bounds.maxX;
                const y1 = bounds.maxY;

                // Extract user text
                const textBody = anno.body && anno.body.find(b => b.type === 'TextualBody');
                const textValue = textBody ? textBody.value : '';

                return {
                    id: anno.id,
                    text: textValue,
                    x0: x0,
                    y0: y0,
                    x1: x1,
                    y1: y1
                };
            });


        //    const jsonString = JSON.stringify(annotations, null, 2);
            const jsonString = JSON.stringify(formattedAnnotations, null, 2);
            
            navigator.clipboard.writeText(jsonString).then(() => {
                alert('Annotations copied to clipboard!');
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = jsonString;
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert('Annotations copied to clipboard!');
                } catch (err) {
                    alert('Failed to copy annotations.');
                }
                document.body.removeChild(textArea);
            });
        });


            // Handle Image Upload & Initialization
            imageLoader.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    // Reset old instance if it exists
                    if (annoInstance) {
                        annoInstance.destroy();
                        annoInstance = null;
                    }

                    targetImage.src = event.target.result;
                    targetImage.style.display = "block";
                    placeholder.style.display = "none";

                    // Initialize Annotorious V3 on target image
                    // V3 uses headless initialization to let you design custom sidebar controls effortlessly
                    annoInstance = Annotorious.createImageAnnotator(targetImage);

                    // Sync Annotorious state changes to UI
                    setupLifecycleListeners();
                };
                reader.readAsDataURL(file);
            });

            // Set up Annotorious Event Lifecycles
            function setupLifecycleListeners() {
                if (!annoInstance) return;

                // Handle Selection Lifecycle
                annoInstance.on('selectionChanged', (selections) => {
                    if (selections && selections.length > 0) {
                        currentSelectedId = selections[0].id;
                        highlightSidebarItem(currentSelectedId);
                    } else {
                        currentSelectedId = null;
                        highlightSidebarItem(null);
                    }
                });

                // Update list when annotations are added, modified, or removed
                annoInstance.on('createAnnotation', updateSidebarList);
                annoInstance.on('updateAnnotation', updateSidebarList);
                annoInstance.on('deleteAnnotation', updateSidebarList);
                
                // Refresh list visually right away
                updateSidebarList();
            }

            // Render and Manage Side Cards
            function updateSidebarList() {
                if (!annoInstance) return;
                
                const annotations = annoInstance.getAnnotations();
                annotationList.innerHTML = '';

                if (annotations.length === 0) {
                    annotationList.innerHTML = '<p class="empty-state">No boxes defined yet.</p>';
                    return;
                }

                annotations.forEach((anno, index) => {
                    // Extract text comments safely out of the standard W3C Web Annotation shape body
                    const textBody = anno.body && anno.body.find(b => b.type === 'TextualBody');
                    const textValue = textBody ? textBody.value : '';

                    const card = document.createElement('div');
                    card.className = `annotation-card ${anno.id === currentSelectedId ? 'active' : ''}`;
                    card.dataset.id = anno.id;

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="region-label">Region #${index + 1}</span>
                            <button class="delete-card-btn" title="Delete Region">&times;</button>
                        </div>
                        <textarea class="card-input" placeholder="Type region note/label...">${textValue}</textarea>
                    `;

                    // Click card to highlight/select area on image
                    card.addEventListener('click', (e) => {
                        if (e.target.classList.contains('delete-card-btn') || e.target.classList.contains('card-input')) return;
                        annoInstance.setSelected(anno.id);
                    });

                    // Live update annotation comment when text is changed
                    const textarea = card.querySelector('.card-input');
                    textarea.addEventListener('input', (e) => {
                        const updatedValue = e.target.value;
                        const existingBodies = anno.body ? [...anno.body] : [];
                        const bodyIndex = existingBodies.findIndex(b => b.type === 'TextualBody');

                        if (bodyIndex > -1) {
                            existingBodies[bodyIndex].value = updatedValue;
                        } else {
                            existingBodies.push({
                                type: 'TextualBody',
                                value: updatedValue,
                                purpose: 'commenting'
                            });
                        }

                        anno.body = existingBodies;
                        // Silently update without complete re-render loops
                        annoInstance.updateAnnotation(anno);
                    });

                    // Card delete button action
                    card.querySelector('.delete-card-btn').addEventListener('click', () => {
                        annoInstance.removeAnnotation(anno.id);
                    });

                    annotationList.appendChild(card);
                });
            }

            function highlightSidebarItem(id) {
                document.querySelectorAll('.annotation-card').forEach(card => {
                    if (card.dataset.id === id) {
                        card.classList.add('active');
                        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else {
                        card.classList.remove('active');
                    }
                });
            }

            // Keyboard Shortcut Core Logic
            window.addEventListener('keydown', (e) => {
                if (!annoInstance) return;

                // Stop shortcuts if user is typing in the annotation texts input fields
                if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') {
                    return;
                }

                const key = e.key.toLowerCase();

                // 'n' -> Activate Region Drawing tool
                if (key === 'n') {
                    e.preventDefault();
                    // Set drawing mode to 'rectangle'
                    annoInstance.setDrawingMode('rectangle');
                    annoInstance.setDrawingEnabled(true);
                }

                // 'escape' -> Clear tools and selections
                if (key === 'escape') {
                    e.preventDefault();
                    annoInstance.cancelSelected();
                    annoInstance.setDrawingEnabled(false);
                }

                // 'delete' or 'backspace' -> Remove highlighted annotation
                if ((e.key === 'Delete' || e.key === 'Backspace') && currentSelectedId) {
                    e.preventDefault();
                    annoInstance.removeAnnotation(currentSelectedId);
                    currentSelectedId = null;
                }
            });
        });
    </script>
    <style>
/* Base Variables & Reset */
:root {
    --bg-primary: #f8f9fa;
    --bg-surface: #ffffff;
    --border-color: #e2e8f0;
    --text-main: #1a202c;
    --primary-color: #4f46e5;
    --primary-hover: #4338ca;
    --accent-active: #e0e7ff;
    --danger-color: #ef4444;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
}

/* App Container Layout */
.app-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Header Action Panel */
.controls-panel {
    background-color: var(--bg-surface);
    border-bottom: 1px solid var(--border-color);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
}

.controls-panel h2 {
    font-size: 1.25rem;
    font-weight: 600;
}

.actions {
    display: flex;
    gap: 1rem;
}

.btn {
    padding: 0.5rem 1.25rem;
    border-radius: 0.375rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: background 0.2s ease;
}

.btn-primary {
    background-color: var(--primary-color);
    color: white;
}

.btn-primary:hover {
    background-color: var(--primary-hover);
}

.shortcuts-guide {
    font-size: 0.85rem;
    color: #718096;
}

kbd {
    background: #edf2f7;
    border: 1px solid #cbd5e0;
    border-radius: 3px;
    padding: 0.1rem 0.4rem;
    font-size: 0.8rem;
    font-family: monospace;
}

/* Main Workspace Split Layout */
.workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
}

/* Image Mounting Container */
.image-wrapper {
    flex: 1;
    background-color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: auto;
    position: relative;
}

.image-wrapper img {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.placeholder-text {
    color: #a0aec0;
    font-size: 1.1rem;
}

/* Sidebar Regions Management */
.sidebar {
    width: 320px;
    background-color: var(--bg-surface);
    border-left: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 1.5rem 1rem;
}

.sidebar h3 {
    margin-bottom: 1rem;
    font-size: 1.1rem;
    font-weight: 600;
    border-bottom: 2px solid var(--bg-primary);
    padding-bottom: 0.5rem;
}

.annotation-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.empty-state {
    color: #a0aec0;
    text-align: center;
    margin-top: 2rem;
    font-style: italic;
}

/* Annotation Card Elements */
.annotation-card {
    border: 1px solid var(--border-color);
    border-radius: 0.5rem;
    padding: 0.75rem;
    background-color: var(--bg-primary);
    cursor: pointer;
    transition: all 0.2s ease;
}

.annotation-card:hover {
    border-color: #cbd5e0;
}

.annotation-card.active {
    background-color: var(--accent-active);
    border-color: var(--primary-color);
    box-shadow: 0 0 0 1px var(--primary-color);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
}

.region-label {
    font-size: 0.85rem;
    font-weight: bold;
    color: #4a5568;
}

.delete-card-btn {
    background: transparent;
    border: none;
    color: #a0aec0;
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 0.25rem;
}

.delete-card-btn:hover {
    color: var(--danger-color);
}

.card-input {
    width: 100%;
    min-height: 60px;
    border: 1px solid var(--border-color);
    border-radius: 0.25rem;
    padding: 0.4rem;
    font-family: inherit;
    font-size: 0.9rem;
    resize: vertical;
    background-color: var(--bg-surface);
}

.card-input:focus {
    outline: none;
    border-color: var(--primary-color);
}

/* Overriding Annotorious selection boxes default styles cleanly */
.a9s-annotation.selected .a9s-inner {
    stroke: var(--primary-color) !important;
    stroke-width: 3px !important;
}


    </style>
</body>
</html>
